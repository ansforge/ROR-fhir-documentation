<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  // Kramdown renders ```mermaid fenced blocks as <pre><code class="language-mermaid">…</code></pre>.
  // Convert them to the <div class="mermaid"> markup mermaid.js expects before running it.
  document.querySelectorAll('pre > code.language-mermaid').forEach(function (codeEl) {
    var pre = codeEl.parentElement;
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = codeEl.textContent;
    pre.replaceWith(div);
  });

  mermaid.initialize({ startOnLoad: true, theme: 'default' });
</script>
